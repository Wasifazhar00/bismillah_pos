yaml
   name: Build Application Releases

   on:
     push:
       branches: [ "main" ]
     pull_request:
       branches: [ "main" ]

   jobs:
     android-build:
       name: Build Android APK
       runs-on: ubuntu-latest
       steps:
         - name: Checkout Code
           uses: actions/checkout@v4

         - name: Setup Java Development Kit
           uses: actions/setup-java@v4
           with:
             distribution: 'temurin'
             java-version: '17'

         - name: Setup Flutter
           uses: subosito/flutter-action@v2
           with:
             channel: 'stable'
             cache: true

         - name: Generate Core Platform Architecture
           run: flutter create --platforms=android .

         - name: Fetch App Dependencies
           run: flutter pub get

         - name: Compile Release APK
           run: flutter build apk --release

         - name: Save APK File
           uses: actions/upload-artifact@v4
           with:
             name: Bismillah-POS-Android-APK
             path: build/app/outputs/flutter-apk/app-release.apk

     windows-build:
       name: Build Windows EXE
       runs-on: windows-latest
       steps:
         - name: Checkout Code
           uses: actions/checkout@v4

         - name: Setup Flutter
           uses: subosito/flutter-action@v2
           with:
             channel: 'stable'
             cache: true

         - name: Enable Windows Compiler Target
           run: flutter config --enable-windows-desktop

         - name: Generate Core Desktop Architecture
           run: flutter create --platforms=windows .

         - name: Fetch App Dependencies
           run: flutter pub get

         - name: Compile Windows Native App
           run: flutter build windows --release

         - name: Save Windows App Directory
           uses: actions/upload-artifact@v4
           with:
             name: Bismillah-POS-Windows-App
             path: build/windows/x64/runner/Release/
